name: watchpost

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: watchpost
      POSTGRES_PASSWORD: watchpost
      POSTGRES_DB: watchpost
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchpost -d watchpost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  fake-target:
    build:
      context: .
      dockerfile: tools/fake-target/Dockerfile
    environment:
      FAKE_TARGET_TLS_DAYS: "5"
    ports:
      - "4100:4100"
      - "4101:4101"
      - "4102:4102"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
