# Weekly dependency updates (PRODUCT.md P0-T07, §12 supply chain). Versions are pinned, so every bump is a reviewed PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directories:
      - /tools/fake-target
    schedule:
      interval: weekly
      day: monday
