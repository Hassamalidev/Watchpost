# CI for every push and pull request (PRODUCT.md P0-T07). Never disable a check to make it pass (§2.3).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_ENV: test
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: watchpost
          POSTGRES_PASSWORD: watchpost
          POSTGRES_DB: watchpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U watchpost -d watchpost"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://watchpost:watchpost@localhost:5432/watchpost
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  web-e2e:
    name: Web e2e and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web (and the packages it depends on)
        run: pnpm turbo run build --filter=@app/web...
      - name: Playwright (light and dark, axe)
        working-directory: backend/web
        run: pnpm test:e2e
      - name: Lighthouse accessibility >= 95
        working-directory: backend/web
        run: |
          pnpm exec next start --port 3000 &
          npx --yes wait-on@8 --timeout 60000 http://127.0.0.1:3000
          pnpm lighthouse
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            backend/web/playwright-report
            backend/web/test-results
          retention-days: 7
