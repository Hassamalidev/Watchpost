# Builds the probe image and pushes it to the GitHub Container Registry when a tag like
# probe-v0.1.0 is pushed. Private probes pull this image (PRIVATE_PROBE_IMAGE); our own probe
# servers are rolled out with backend/scripts/deploy-probes.sh.
name: Probe image

on:
  push:
    tags: ["probe-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#probe-v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: probe/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/hassamalidev/watchpost-probe:${{ steps.version.outputs.version }}
            ghcr.io/hassamalidev/watchpost-probe:latest
